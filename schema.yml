components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 150
        type:
          $ref: '#/components/schemas/AccountTypeEnum'
        parent:
          type: integer
          nullable: true
        description:
          type: string
        is_active:
          type: boolean
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - balance
      - code
      - created_at
      - id
      - name
      - type
    AccountRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 50
        name:
          type: string
          minLength: 1
          maxLength: 150
        type:
          $ref: '#/components/schemas/AccountTypeEnum'
        parent:
          type: integer
          nullable: true
        description:
          type: string
        is_active:
          type: boolean
      required:
      - code
      - name
      - type
    AccountTypeEnum:
      enum:
      - asset
      - liability
      - equity
      - revenue
      - expense
      type: string
      description: |-
        * `asset` - Asset
        * `liability` - Liability
        * `equity` - Equity
        * `revenue` - Revenue
        * `expense` - Expense
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          nullable: true
        user_email:
          type: string
          format: email
          readOnly: true
        action:
          type: string
          maxLength: 50
        module:
          type: string
          maxLength: 50
        object_id:
          type: string
          maxLength: 100
        details: {}
        ip_address:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - created_at
      - id
      - module
      - user_email
    Batch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        item:
          type: integer
        item_sku:
          type: string
          readOnly: true
        batch_number:
          type: string
          maxLength: 100
        manufacturing_date:
          type: string
          format: date
          nullable: true
        expiration_date:
          type: string
          format: date
          nullable: true
        notes:
          type: string
      required:
      - batch_number
      - id
      - item
      - item_sku
    BatchRequest:
      type: object
      properties:
        item:
          type: integer
        batch_number:
          type: string
          minLength: 1
          maxLength: 100
        manufacturing_date:
          type: string
          format: date
          nullable: true
        expiration_date:
          type: string
          format: date
          nullable: true
        notes:
          type: string
      required:
      - batch_number
      - item
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        slug:
          type: string
          maxLength: 150
          pattern: ^[-a-zA-Z0-9_]+$
        parent:
          type: integer
          nullable: true
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - slug
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        slug:
          type: string
          minLength: 1
          maxLength: 150
          pattern: ^[-a-zA-Z0-9_]+$
        parent:
          type: integer
          nullable: true
        description:
          type: string
      required:
      - name
      - slug
    ContainerImport:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        container_number:
          type: string
          maxLength: 100
        vessel_name:
          type: string
          maxLength: 150
        shipping_line:
          type: string
          maxLength: 100
        port_of_loading:
          type: string
          maxLength: 100
        port_of_discharge:
          type: string
          maxLength: 100
        estimated_arrival:
          type: string
          format: date
          nullable: true
        status:
          $ref: '#/components/schemas/ContainerImportStatusEnum'
        purchase_order:
          type: integer
          nullable: true
        po_number:
          type: string
          readOnly: true
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - container_number
      - created_at
      - id
      - po_number
    ContainerImportRequest:
      type: object
      properties:
        container_number:
          type: string
          minLength: 1
          maxLength: 100
        vessel_name:
          type: string
          maxLength: 150
        shipping_line:
          type: string
          maxLength: 100
        port_of_loading:
          type: string
          maxLength: 100
        port_of_discharge:
          type: string
          maxLength: 100
        estimated_arrival:
          type: string
          format: date
          nullable: true
        status:
          $ref: '#/components/schemas/ContainerImportStatusEnum'
        purchase_order:
          type: integer
          nullable: true
        notes:
          type: string
      required:
      - container_number
    ContainerImportStatusEnum:
      enum:
      - manifested
      - in_transit
      - customs
      - delivered
      type: string
      description: |-
        * `manifested` - Manifested
        * `in_transit` - In Transit (Ocean)
        * `customs` - Customs Clearance
        * `delivered` - Delivered to Warehouse
    CurrentUserProfileResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        tenant:
          type: object
          additionalProperties: {}
          nullable: true
        role:
          type: string
          nullable: true
        is_tenant_admin:
          type: boolean
      required:
      - is_tenant_admin
      - role
      - tenant
      - user
    DynamicRecord:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        module:
          type: integer
        module_slug:
          type: string
          readOnly: true
        data: {}
        journal_entry:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - journal_entry
      - module
      - module_slug
      - updated_at
    DynamicRecordRequest:
      type: object
      properties:
        module:
          type: integer
        data: {}
      required:
      - module
    ExtensionRegistry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 150
        description:
          type: string
        category:
          type: string
          maxLength: 50
        version:
          type: string
          maxLength: 20
        is_available:
          type: boolean
      required:
      - code
      - description
      - id
      - name
    FieldDefinition:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        module:
          type: integer
        field_name:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        label:
          type: string
          maxLength: 100
        field_type:
          $ref: '#/components/schemas/FieldTypeEnum'
        is_required:
          type: boolean
        default_value:
          type: string
          maxLength: 255
        options:
          description: Allowed choice options for dropdown field type
        relation_target:
          type: string
          description: Target model for relation field (e.g. 'parties.Party', 'catalog.Item')
          maxLength: 100
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - field_name
      - id
      - label
      - module
    FieldDefinitionRequest:
      type: object
      properties:
        module:
          type: integer
        field_name:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        label:
          type: string
          minLength: 1
          maxLength: 100
        field_type:
          $ref: '#/components/schemas/FieldTypeEnum'
        is_required:
          type: boolean
        default_value:
          type: string
          maxLength: 255
        options:
          description: Allowed choice options for dropdown field type
        relation_target:
          type: string
          description: Target model for relation field (e.g. 'parties.Party', 'catalog.Item')
          maxLength: 100
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - field_name
      - label
      - module
    FieldTypeEnum:
      enum:
      - text
      - number
      - date
      - dropdown
      - relation
      - boolean
      - file
      type: string
      description: |-
        * `text` - Text / String
        * `number` - Numeric (Decimal / Integer)
        * `date` - Date
        * `dropdown` - Dropdown Selection
        * `relation` - Relation to Party / Item
        * `boolean` - Boolean (Yes/No)
        * `file` - File / Document Attachment
    Item:
      type: object
      description: Serializer mixin that automatically removes fields the current
        user's role is not permitted to see.
      properties:
        id:
          type: integer
          readOnly: true
        sku:
          type: string
          maxLength: 100
        name:
          type: string
          maxLength: 255
        type:
          $ref: '#/components/schemas/ItemTypeEnum'
        is_stock_tracked:
          type: boolean
          description: If False, inventory stock movements are skipped for this item.
        category:
          type: integer
          nullable: true
        category_name:
          type: string
          readOnly: true
        unit_of_measure:
          type: string
          maxLength: 50
        selling_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        cost_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        tax_rate:
